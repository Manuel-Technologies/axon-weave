version: "3.9"
services:
  redis:
    image: redis:7
    container_name: axon-weave-redis
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axon-weave-api
    depends_on:
      - redis
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Data Source=/app/axon_weave.db
      Redis__ConnectionString: redis:6379
      Storage__PublicBaseUrl: http://localhost:8080/uploads
      Jwt__SecretKey: replace-with-a-very-long-random-string-for-production
    ports:
      - "8080:8080"
    volumes:
      - uploads-data:/app/uploads
      - sqlite-data:/app

volumes:
  uploads-data:
  sqlite-data:
