version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: axon-weave-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__DefaultConnection: Data Source=/app/data/axon_weave.db
      Storage__PublicBaseUrl: http://localhost:8080/uploads
      Jwt__SecretKey: replace-with-a-very-long-random-string-for-production
      Otp__UseStaticOtp: "true"
      Otp__StaticOtpCode: "123456"
    ports:
      - "8080:8080"
    volumes:
      - sqlite-data:/app/data
      - uploads-data:/app/uploads

volumes:
  sqlite-data:
  uploads-data:
