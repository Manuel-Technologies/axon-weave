services:
  - type: web
    name: axon-weave-api
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ConnectionStrings__DefaultConnection
        value: Data Source=/app/data/axon_weave.db
      - key: Jwt__Issuer
        value: axon-weave
      - key: Jwt__Audience
        value: axon-weave-client
      - key: Jwt__SecretKey
        generateValue: true
      - key: Otp__UseStaticOtp
        value: "true"
      - key: Otp__StaticOtpCode
        value: "123456"
      - key: Otp__ExpiryMinutes
        value: "5"
      - key: Storage__RootPath
        value: /app/uploads
      - key: Cors__AllowAnyOrigin
        value: "true"
